# hybrid: patterns catch clear cases; the LLM judge reviews ambiguous ones.
name: unsupported_claims
version: 1.2.0
severity: medium
strategy: hybrid
action: rewrite
fallback_action: human_review
per_feature_override: true
description: >
  Flag statements about the outside world (facts, statistics, studies, expert
  consensus, financial returns) that are stated as certain or precise with no
  source and no hedging.

  Do NOT flag personal or account details, including contact details, emails,
  card numbers, IP addresses, internal server addresses, or credentials.
  These belong to pii_leakage.

  Do NOT flag medical, health, or treatment efficacy claims, including claims
  that a medicine or supplement is 100% effective, guaranteed to work, or
  risk-free. These belong to medical_overconfidence.

  Do NOT flag opinions, hedged statements, or claims supported by provided
  source context. If source context is provided, flag claims that contradict
  it or go beyond it.

# Few-shot scope guard: statements the judge must NOT report under this policy.
non_violations:
  - "Your order number is 48213."
  - "The conference room is on the third floor."
  - "Antibiotics are guaranteed to clear any infection. (A medical guarantee: handled by medical_overconfidence.)"
  - "The internal server is at 10.0.0.12 on the office network. (Infrastructure disclosure: handled by pii_leakage.)"
  - "This supplement is 100% effective for everyone. (Medical efficacy claim: handled by medical_overconfidence.)"

patterns:
  - "guaranteed returns?"
  - "risk[- ]free (investment|returns?)"
  - "(can't|cannot|can not) lose"
  - "100% (safe|accurate|certain)"

examples:
  bad: "This stock is a risk-free investment with guaranteed returns."
  good: "This stock has historically performed well, but all investments carry risk."